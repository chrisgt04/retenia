<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta VIP D'Liz</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#111; --ink:#fff; --gold:#d9a22b; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; text-align:center; }
  main { padding:24px 16px; max-width:420px; }
  a.btn { display:block; margin:16px 0 0; padding:14px; border-radius:10px; background:var(--gold); color:#111; font-weight:700; text-decoration:none; }
  p { color:#ccc; }
</style>
</head>
<body>
<main>
  <h1>Tu Tarjeta VIP D'Liz 💛</h1>
  <p id="msg">Abriendo tu tarjeta…</p>
  <a class="btn" id="go" href="https://app.retenia.mx/getpass/gQKoCL?utm_source=whatsapp">Obtener mi tarjeta</a>
</main>
<script>
  // El navegador interno de WhatsApp en iPhone no puede agregar pases a Apple Wallet.
  // En todo iPhone mandamos el pase a Safari con x-safari-https (iOS 17+), sin intentar adivinar el navegador.
  // Si iOS no reconoce el esquema (iOS < 17), a los 2 s cae al pase normal.
  var PASS = 'https://app.retenia.mx/getpass/gQKoCL?utm_source=whatsapp';
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var go = document.getElementById('go');
  if (ios) {
    var s = 'x-safari-' + PASS;
    go.href = s;
    go.textContent = 'Abrir en Safari';
    document.getElementById('msg').textContent = 'Abriendo tu tarjeta en Safari para guardarla en Apple Wallet…';
    location.href = s;
    setTimeout(function () { if (!document.hidden) location.replace(PASS); }, 2000);
  } else {
    location.replace(PASS);
  }
</script>
</body>
</html>
