<title>Retenia — Agenda tu demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--verde:#1E7A52;--verde6:#176242;--v900:#0F1714;--menta:#A8EBD3;--cream:#faf9f5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:#0f1714;background:radial-gradient(120% 90% at 80% -10%,#2B8C5D 0%,#1E6B4A 42%,#133f2c 85%);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:24px 18px 48px}
header{width:100%;max-width:520px;padding:14px 0 10px;display:flex;justify-content:center}
header img{height:34px}
.card{background:var(--cream);width:100%;max-width:520px;border-radius:24px;padding:30px 26px 26px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);margin-top:6px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:27px;letter-spacing:-.02em;line-height:1.08}
h1 em{font-style:normal;color:var(--verde)}
.sub{font-size:14.5px;color:#5f6864;margin:8px 0 18px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;margin:13px 0 5px;color:#24392f}
input,select{width:100%;padding:12px 13px;border:1px solid rgba(15,23,20,.16);border-radius:12px;font-size:16px;background:#fff;color:#0f1714;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(30,122,82,.15)}
.phone{display:flex;gap:8px}.phone select{width:128px;flex:none}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
#go{width:100%;margin-top:20px;padding:15px;border:0;border-radius:999px;background:var(--verde);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
#go:hover{background:var(--verde6)}#go:disabled{opacity:.6;cursor:default}
#err{color:#b4232a;font-size:13.5px;margin-top:10px;display:none;line-height:1.4}
.trust{text-align:center;font-size:12.5px;color:#5f6864;margin-top:14px}
.back{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;margin-top:18px}
@media(max-width:560px){.row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header><a href="/"><img src="/assets/logo.png" alt="Retenia"></a></header>
<div class="card">
  <h1>Agenda tu <em>demo</em></h1>
  <p class="sub">Déjanos tus datos y elige un horario. Te mostramos Retenia en 30 minutos, personalizado para tu negocio.</p>
  <form id="f" novalidate>
    <label>Nombre*</label><input name="nombre" required autocomplete="name">
    <label>Empresa / Negocio*</label><input name="negocio" required>
    <label>WhatsApp*</label>
    <div class="phone">
      <select name="lada" id="lada"></select>
      <input name="telefono" required inputmode="numeric" placeholder="10 dígitos" autocomplete="tel">
    </div>
    <label>Correo*</label><input name="correo" type="email" required autocomplete="email">
    <label>Giro del negocio*</label><select name="giro" required id="giro"></select>
    <div class="row">
      <div><label>Sucursales*</label><select name="sucursales" required id="suc"></select></div>
      <div><label>Ciudad*</label><input name="ciudad" required></div>
    </div>
    <div class="row">
      <div><label>Rol*</label><select name="rol" required id="rol"></select></div>
      <div><label>Ticket promedio*</label><select name="ticket" required id="tk"></select></div>
    </div>
    <div id="err"></div>
    <button id="go" type="submit">Continuar a agendar →</button>
    <div class="trust">Demo de 30 min · sin compromiso</div>
  </form>
</div>
<a class="back" href="/">← Volver</a>
<script>
(function(){
  var CAL="https://calendly.com/hola-retenia/30min";
  var HOOK="https://n8n.unifai.com.mx/webhook/87e15310-bc00-4a0d-a3cf-a5e1b724b389";
  var LADAS=[["🇲🇽","+52"],["🇺🇸","+1"],["🇨🇴","+57"],["🇦🇷","+54"],["🇨🇱","+56"],["🇵🇪","+51"],["🇪🇨","+593"],["🇬🇹","+502"],["🇪🇸","+34"]];
  var GIROS=["Cafetería","Restaurante","Estética / Salón de belleza","Gimnasio / Fitness","Tienda / Retail","Panadería","Consultorio","Veterinaria","Servicios profesionales","Área de juegos infantil","Otro"];
  var SUC=["1","2 – 5","6 – 10","11 – 20","Más de 20"];
  var ROLES=["Dueño / Dueña","Gerente","Marketing","Otro"];
  var TICKETS=["Menos de $100","$100 – $300","$300 – $600","$600 – $1,000","$1,000 – $3,000","Más de $3,000"];
  function fill(id,arr,ph){var s=document.getElementById(id);s.innerHTML='<option value="">'+(ph||'Selecciona…')+'</option>'+arr.map(function(v){return '<option>'+v+'</option>';}).join('');}
  document.getElementById('lada').innerHTML=LADAS.map(function(l,i){return '<option value="'+l[1]+'"'+(i===0?' selected':'')+'>'+l[0]+' '+l[1]+'</option>';}).join('');
  fill('giro',GIROS);fill('suc',SUC);fill('rol',ROLES);fill('tk',TICKETS);
  function qp(n){try{return new URLSearchParams(location.search).get(n)||"";}catch(e){return "";}}
  function ck(n){var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return m?m.pop():"";}
  var sent=false;
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,btn=document.getElementById('go'),err=document.getElementById('err');
    var g=function(n){return (f.elements[n]&&f.elements[n].value||'').trim();};
    var tel=g('telefono').replace(/\D/g,''),lada=g('lada').replace(/\D/g,'');
    if(!g('nombre')||!g('negocio')||tel.length<8||!/.+@.+\..+/.test(g('correo'))||!g('giro')||!g('sucursales')||!g('ciudad')||!g('rol')||!g('ticket')){
      err.textContent='Completa todos los campos (WhatsApp y correo válidos).';err.style.display='block';return;
    }
    if(g('sucursales')==='1'||parseInt((g('ticket').replace(/,/g,'').match(/[0-9]+/)||['0'])[0],10)<300){
      err.textContent='Por ahora Retenia trabaja con negocios de más de 1 sucursal y ticket promedio desde $300. Aún no podemos agendar tu demo.';err.style.display='block';return;
    }
    err.style.display='none';btn.disabled=true;btn.textContent='Enviando…';
    var data={nombre:g('nombre'),negocio:g('negocio'),whatsapp:lada+tel,correo:g('correo'),tipo_negocio:g('giro'),sucursales:g('sucursales'),ciudad:g('ciudad'),rol:g('rol'),ticket_promedio:g('ticket'),submittedAt:new Date().toISOString(),page_url:location.href,utm_source:qp('utm_source'),utm_medium:qp('utm_medium'),utm_campaign:qp('utm_campaign'),utm_content:qp('utm_content'),utm_term:qp('utm_term'),fbclid:qp('fbclid'),fbp:ck('_fbp'),fbc:ck('_fbc')};
    var body=Object.keys(data).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(data[k]);}).join('&');
    function go(){if(sent)return;sent=true;location.href=CAL+'?name='+encodeURIComponent(data.nombre)+'&email='+encodeURIComponent(data.correo);}
    try{fetch(HOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body}).then(go,go);}catch(_){}
    setTimeout(go,1800);
  });
})();
</script>
</body>
</html>
